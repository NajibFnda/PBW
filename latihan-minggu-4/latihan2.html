<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form Input Nilai</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    h2 {
      text-align: left;
    }
    table {
      border: 1;
      width: 100%;
      margin-bottom: 20px;
    }
    table, th, td {
      border: 1px solid black;
    }
    th, td {
      padding: 8px;
      text-align: center;
    }
    input[type="text"] {
      width: 200px;
      padding: 5px;
    }
    .form-table {
      width: 60%;
      margin-bottom: 10px;
    }
    .form-table td {
      text-align: left;
    }
    .btn {
      padding: 5px 10px;
      background-color: #ddd;
      border: 1px solid #666;
      cursor: pointer;
      border-radius: 5px
    }
    .btn:hover {
      background-color: #ffffff;
    }
  </style>
</head>
<body>

  <h2>Form Input Nilai</h2>
  <table class="form-table">
    <tr>
      <td>NIM</td>
      <td>:</td>
      <td><input type="text" placeholder="silakan isi NIM"></td>
    </tr>
    <tr>
      <td>Nilai Tugas</td>
      <td>:</td>
      <td><input type="text" placeholder="silakan isi nilai tugas"></td>
    </tr>
    <tr>
      <td>Nilai UTS</td>
      <td>:</td>
      <td><input type="text" placeholder="silakan isi nilai uts"></td>
    </tr>
    <tr>
      <td>Nilai UAS</td>
      <td>:</td>
      <td><input type="text" placeholder="silakan isi nilai uas"></td>
    </tr>
    <tr>
      <td colspan="3" style="text-align: center;">
        <button class="btn">Simpan</button>
      </td>
    </tr>
  </table>

  <table>
    <tr>
      <th rowspan="2">No</th>
      <th rowspan="2">NIM</th>
      <th rowspan="2">Nama</th>
      <th colspan="3">Nilai</th>
    </tr>
    <tr>
      <th>Tugas</th>
      <th>UTS</th>
      <th>UAS</th>
    </tr>
    <tr>
      <td>1</td>
      <td>A11.2023.12345</td>
      <td>Aprilyani</td>
      <td>60</td>
      <td>76</td>
      <td>90</td>
    </tr>
    <tr>
      <td>2</td>
      <td>A11.2023.12346</td>
      <td>Nur</td>
      <td>76</td>
      <td>88</td>
      <td>60</td>
    </tr>
    <tr>
      <td>3</td>
      <td>A11.2023.12347</td>
      <td>Safitri</td>
      <td>96</td>
      <td>78</td>
      <td>75</td>
    </tr>
  </table>

</body>
</html>
